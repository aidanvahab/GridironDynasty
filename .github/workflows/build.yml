name: Test & Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import assets
        run: ./godot --headless --path . --import || true

      - name: Lint and unit tests
        run: |
          GODOT=./godot tools/lint.sh
          GODOT=./godot tools/test.sh

      - name: Export Windows, macOS, Linux
        run: |
          mkdir -p build/windows build/macos build/linux dist
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/GridironDynasty.exe
          ./godot --headless --path . --export-release "macOS" build/macos/GridironDynasty.zip
          ./godot --headless --path . --export-release "Linux" build/linux/GridironDynasty.x86_64
          v=$(grep -oP 'config/version="\K[^"]+' project.godot)
          (cd build/windows && zip -q -9 "../../dist/GridironDynasty-$v-windows-x86_64.zip" GridironDynasty.exe)
          cp build/macos/GridironDynasty.zip "dist/GridironDynasty-$v-macos-universal.zip"
          tar -C build/linux -czf "dist/GridironDynasty-$v-linux-x86_64.tar.gz" GridironDynasty.x86_64
          (cd dist && sha256sum GridironDynasty-* > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GridironDynasty-windows
          path: dist/*windows*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GridironDynasty-macos
          path: dist/*macos*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GridironDynasty-linux
          path: dist/*linux*.tar.gz

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
